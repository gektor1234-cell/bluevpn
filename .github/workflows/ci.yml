name: Green VPN CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: greenvpn-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check whitespace in the pushed or proposed change set
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          elif [[ "${{ github.event.before }}" =~ ^[0-9a-f]{40}$ ]] &&
               [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "${{ github.event.before }}..HEAD"
          else
            git show --check --oneline --format=fuller HEAD
          fi
      - run: python -m py_compile scripts/security/scan_tracked_secrets.py
      - run: python scripts/security/scan_tracked_secrets.py --history

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend_live/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend_live/requirements.txt
      - run: python -m py_compile backend_live/app/main.py
      - run: python -m unittest discover -s backend_live/tests -p 'test_*.py'

  backend-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend_live/requirements.txt
      - run: python -m pip install --upgrade pip pip-audit
      - run: python -m pip_audit -r backend_live/requirements.txt

  public-surface-probe-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m py_compile scripts/monitoring/public_surface_probe.py
      - run: python scripts/monitoring/public_surface_probe.py --target production_api --attempts 2

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: [default, production]
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Test the complete client suite in each release contour
        shell: bash
        run: |
          if [[ "${{ matrix.profile }}" == "production" ]]; then
            flutter test --no-pub --dart-define=GREENVPN_PUBLIC_PRODUCT_BUILD=true \
              --dart-define=GREENVPN_FUSION_UI_ENABLED=true \
              --dart-define=GREENVPN_EXPECT_FUSION_UI_ENABLED=true \
              --dart-define=GREENVPN_TRIAL_ONLY_NO_ADS_BUILD=false \
              --dart-define=GREENVPN_PAID_BETA_BUILD=false \
              --dart-define=GREENVPN_FUSION_PRODUCTION_PROMOTION_CANDIDATE=true \
              --dart-define=GREENVPN_AWG2_PREVIEW_ENABLED=true \
              --dart-define=GREENVPN_HYSTERIA2_PREVIEW_ENABLED=true \
              --dart-define=GREENVPN_VLESS_REALITY_PREVIEW_ENABLED=true \
              --dart-define=GREENVPN_NAIVE_HTTPS_PREVIEW_ENABLED=true \
              --dart-define=GREENVPN_DNSTT_PREVIEW_ENABLED=true
          else
            flutter test --no-pub
          fi

  local-service-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify fragmented and bounded HTTP headers without a Windows service
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror windows/green_vpn_service/http_headers_test.cpp -o /tmp/http-headers-test
          /tmp/http-headers-test

  android-app-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GREENVPN_ANDROID_AWG2_PREVIEW_ENABLED: 'true'
      GREENVPN_ANDROID_HYSTERIA2_PREVIEW_ENABLED: 'true'
      GREENVPN_ANDROID_VLESS_REALITY_PREVIEW_ENABLED: 'true'
      GREENVPN_ANDROID_NAIVE_HTTPS_PREVIEW_ENABLED: 'true'
      GREENVPN_ANDROID_DNSTT_PREVIEW_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: stable
          cache: true
      - name: Install pinned Android native toolchain
        shell: bash
        run: sdkmanager "ndk;28.2.13676358" "build-tools;36.0.0"
      - run: flutter pub get
      - name: Verify pinned Android native engines
        shell: pwsh
        run: |
          ./scripts/windows/build_android_awg2_native.ps1 -VerifyOnly
          ./scripts/windows/build_android_hysteria2_native.ps1 -VerifyOnly
      - name: Run Android unit tests and lint every transport module
        working-directory: android
        run: >-
          ./gradlew
          :app:testDebugUnitTest
          :app:lintDebug
          :awg_tunnel_preview:lint
          :hysteria_tunnel_preview:lint
          --stacktrace
      - name: Build the complete Android transport APK
        run: >-
          flutter build apk
          --debug
          --no-pub
          --target-platform=android-arm64,android-x64
          --dart-define=GREENVPN_AWG2_PREVIEW_ENABLED=true
          --dart-define=GREENVPN_HYSTERIA2_PREVIEW_ENABLED=true
          --dart-define=GREENVPN_VLESS_REALITY_PREVIEW_ENABLED=true
          --dart-define=GREENVPN_NAIVE_HTTPS_PREVIEW_ENABLED=true
          --dart-define=GREENVPN_DNSTT_PREVIEW_ENABLED=true
      - name: Verify complete APK 16 KB compatibility
        shell: pwsh
        run: >-
          ./scripts/windows/verify_android_16kb_compatibility.ps1
          -ApkPath ./build/app/outputs/flutter-apk/app-debug.apk

  release-gate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Run static release gate
        shell: powershell
        run: ./scripts/windows/bluevpn_release_gate.ps1
